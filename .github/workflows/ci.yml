name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Release собирается без ключа (keystore.properties нет в репозитории) —
      # но с R8, так что ошибки минификации видны и здесь.
      - name: Lint, unit tests, debug and release builds
        run: ./gradlew lint test assembleDebug assembleRelease --stacktrace

      - name: Upload reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: '**/build/reports/**'

  # UI-тесты Compose на эмуляторе: KVM на раннерах есть, но по умолчанию закрыт для пользователя.
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compose UI tests (emulator, API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload UI test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-reports
          path: '**/build/reports/androidTests/**'
